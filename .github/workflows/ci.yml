name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display message file
        run: cat message.txt

      - name: Verify message content
        run: grep -q "Hello from CI/CD lab" message.txt
